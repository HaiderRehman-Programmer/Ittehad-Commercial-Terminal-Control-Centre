    <!-- Internal CSS (Embedded Overrides) -->
    <style>
      :root {
          --primary-color: #5D78FF;
      }
      /* Ensure sidebar stays vertical and fixed despite external CSS */
      .app-container {
          display: flex !important;
          min-height: 100vh !important;
      }
      .sidebar-fixed {
          position: fixed !important;
          left: 0 !important;
          top: 0 !important;
          height: 100vh !important;
          width: 260px !important;
          z-index: 1000 !important;
      }
      .main-content-offset {
          margin-left: 260px !important;
          width: calc(100% - 260px) !important;
          flex: 1 !important;
          background: #f4f7f6 !important;
      }
      .bg-primary {
          background: #5D78FF !important;
      }
      .btn-payment-top {
          position: fixed;
          bottom: 12rem;
          right: 10px;
          width: 50px;
          height: 50px;
          border-radius: 50%;
          display: flex;
          justify-content: center;
          align-items: center;
          transition: all 0.3s;
          z-index: 9999;
      }
      .btn-transfer-top {
          position: fixed;
          bottom: 8rem;
          right: 10px;
          width: 50px;
          height: 50px;
          border-radius: 50%;
          display: flex;
          justify-content: center;
          align-items: center;
          transition: all 0.3s;
          z-index: 9999;
      }
      .btn-payment-top:hover, .btn-transfer-top:hover {
          cursor: pointer;
          transform: scale(1.05);
      }
    </style>
